---

- name: "Include variables wrapper"
  ansible.builtin.include_tasks:
    file: variables.yml
  tags: ["ct-clamav"]

- name: "Disto/Family tasks (FF)"
  ansible.builtin.include_tasks:
    file: "{{ lookup('ansible.builtin.first_found', params) }}"
  vars:
    params:
      files:
      - "{{ ansible_facts['distribution'] }}-{{ ansible_facts['distribution_major_version'].split('.')[0] }}.yml"
      - "{{ ansible_facts['distribution'] }}.yml"
      - "{{ ansible_facts['os_family'] }}.yml"
      - "default.yml"
  tags: ["ct-clamav"]

- name: "Install Clam AV packages"
  ansible.builtin.apt:
    name: "{{ clamav_pkgs }}"
    state: "{{ clamav_state }}"
    update_cache: "{{ clamav_update_cache }}"
  become: true
  tags: ["ct-clamav"]

- name: "Ensure freshclam is running to keep definitions up to date"
  ansible.builtin.systemd:
    enabled: "{{ clamav_freshclam_onboot }}"
    name: "{{ clamav_freshclam_name }}"
    state: "{{ clamav_freshclam_state }}"
  become: true
  tags: ["ct-clamav"]
...
